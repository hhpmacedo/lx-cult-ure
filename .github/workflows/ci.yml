name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Install pipeline dependencies
        run: cd pipeline && npm ci

      - name: Build site
        run: npm run build

      - name: Run smoke tests
        run: cd pipeline && npm test

      - name: Type check pipeline
        run: cd pipeline && npx tsc --noEmit

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Vercel deployment is handled by Vercel's GitHub integration.
      # This job validates the build succeeds before the auto-deploy.
